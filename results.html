<DOCTYPE html>
    <html>

            <h2>Search Result</h2>
            {% for gene in results %} <!-- =curly bracket ,%,for is calling for loop -->

            <p>organism:{{gene.organism}}</p>

            <hr>
            {% end for %}
        </body>
    </html>
</DOCTYPE>
